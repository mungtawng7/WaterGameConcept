<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Verdana, Arial, sans-serif">
  <rect width="960" height="660" fill="#1B1B1B"/>

  <!-- Title screen canvas -->
  <rect width="960" height="540" fill="#EAF6FF"/>
  <circle cx="480" cy="135" r="60" fill="#FFC907"/>
  <path d="M480 100 Q507 137 480 163 Q453 137 480 100 Z" fill="#2E9DF7"/>
  <text x="480" y="250" fill="#1B1B1B" font-size="48" font-weight="bold" text-anchor="middle">WATER DEFENDER</text>
  <text x="480" y="290" fill="#1B1B1B" font-size="20" text-anchor="middle" font-style="italic">Protect every drop from pollution.</text>
  <text x="480" y="330" fill="#1B1B1B" font-size="16" font-weight="bold" text-anchor="middle">Move with ← →     Shoot with Space</text>
  <text x="480" y="356" fill="#1B1B1B" font-size="15" text-anchor="middle">Hit water to fill your jerrycan. Stop the mud before it lands.</text>
  <rect x="380" y="380" width="200" height="56" rx="28" fill="#FFC907"/>
  <text x="480" y="416" fill="#1B1B1B" font-size="24" font-weight="bold" text-anchor="middle">PLAY</text>
  <text x="480" y="470" fill="#1B1B1B" font-size="16" text-anchor="middle">Press Space or click to start</text>

  <!-- Optional user portrait controls shown below the canvas -->
  <rect y="540" width="960" height="92" fill="#FFFFFF"/>
  <text x="18" y="560" fill="#1B1B1B" font-size="14" font-weight="bold">Use</text>
  <g font-size="12" fill="#1B1B1B">
    <circle cx="26" cy="581" r="7" fill="#FFFFFF" stroke="#2E9DF7" stroke-width="2"/>
    <circle cx="26" cy="581" r="3" fill="#2E9DF7"/>
    <text x="39" y="585">Whole face</text>
    <circle cx="125" cy="581" r="7" fill="#FFFFFF" stroke="#2E9DF7" stroke-width="2"/>
    <text x="138" y="585">Eyes</text>
    <circle cx="190" cy="581" r="7" fill="#FFFFFF" stroke="#2E9DF7" stroke-width="2"/>
    <text x="203" y="585">Mouth</text>
  </g>
  <rect x="18" y="596" width="142" height="28" rx="4" fill="#2E9DF7"/>
  <text x="89" y="615" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Take face photo</text>
  <text x="180" y="603" fill="#1B1B1B" font-size="13" font-weight="bold">Shooter photo</text>
  <text x="180" y="620" fill="#333333" font-size="11">Choose a crop, then capture with your camera.</text>
  <rect x="812" y="553" width="112" height="68" rx="4" fill="#222222"/>
  <circle cx="868" cy="582" r="19" fill="#F4B183"/>
  <circle cx="861" cy="579" r="2" fill="#1B1B1B"/>
  <circle cx="875" cy="579" r="2" fill="#1B1B1B"/>
  <path d="M862 590 Q868 596 874 590" fill="none" stroke="#1B1B1B" stroke-width="2"/>
  <text x="868" y="614" text-anchor="middle" fill="#FFFFFF" font-size="9">photo preview</text>
  <text x="16" y="651" fill="#FFFFFF" font-size="12">Use ← → to move. Hold Space to fire both guns.</text>
</svg>
