<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Verdana, Arial, sans-serif">
  <rect width="960" height="660" fill="#1B1B1B"/>

  <!-- Game canvas -->
  <rect width="960" height="540" fill="#EAF6FF"/>
  <rect y="0" width="960" height="48" fill="#2E9DF7"/>
  <text x="16" y="30" fill="#FFFFFF" font-size="20" font-weight="bold">charity: water</text>
  <text x="454" y="30" fill="#FFFFFF" font-size="18">Day 3</text>

  <!-- Water fill, score and hearts -->
  <rect y="48" width="960" height="40" fill="#FFFFFF"/>
  <path d="M22 56 h14 v5 h-14 z M20 61 h18 v20 h-18 z" fill="#FFC907"/>
  <text x="48" y="75" fill="#1B1B1B" font-size="14">Clean water: 40%</text>
  <rect x="218" y="62" width="150" height="14" fill="#E0E0E0"/>
  <rect x="218" y="62" width="60" height="14" fill="#2E9DF7"/>
  <text x="410" y="75" fill="#1B1B1B" font-size="16">Score: 40</text>
  <text x="620" y="75" fill="#1B1B1B" font-size="16">Hearts: ♥♥♥</text>

  <!-- Play field -->
  <rect y="88" width="960" height="372" fill="#EAF6FF"/>
  <path d="M0 132 H960 M0 255 H960 M0 378 H960" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="850" cy="145" r="34" fill="#FFC907"/>

  <!-- Falling clean water -->
  <path d="M300 142 Q330 184 300 202 Q270 184 300 142 Z" fill="#2E9DF7"/>
  <ellipse cx="291" cy="177" rx="3" ry="7" fill="#FFFFFF" opacity=".8"/>

  <!-- Falling mud -->
  <ellipse cx="652" cy="272" rx="22" ry="19" fill="#8C6A3F"/>
  <circle cx="644" cy="267" r="5" fill="#B78C67"/>
  <circle cx="661" cy="277" r="4" fill="#B78C67"/>

  <!-- Two water shots -->
  <rect x="450" y="343" width="8" height="52" fill="#2E9DF7"/>
  <rect x="502" y="343" width="8" height="52" fill="#2E9DF7"/>

  <!-- Shooter with two independent guns and user portrait placeholder -->
  <g>
    <rect x="461" y="435" width="38" height="25" fill="#2E9DF7"/>
    <rect x="451" y="414" width="12" height="28" fill="#176EB1"/>
    <rect x="497" y="414" width="12" height="28" fill="#176EB1"/>
    <rect x="453" y="405" width="8" height="15" fill="#FFC907"/>
    <rect x="499" y="405" width="8" height="15" fill="#FFC907"/>
    <circle cx="480" cy="427" r="13" fill="#F4B183" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="475" cy="426" r="1.5" fill="#1B1B1B"/>
    <circle cx="485" cy="426" r="1.5" fill="#1B1B1B"/>
    <path d="M477 433 Q480 436 483 433" fill="none" stroke="#1B1B1B" stroke-width="1.5"/>
  </g>

  <!-- Ground and community progress -->
  <rect y="460" width="960" height="40" fill="#C8A165"/>
  <rect y="460" width="960" height="5" fill="#8C6A3F"/>
  <rect y="500" width="960" height="40" fill="#FFFFFF"/>
  <text x="16" y="524" fill="#333333" font-size="16">Community Well Progress:</text>
  <rect x="230" y="512" width="500" height="16" fill="#E0E0E0"/>
  <rect x="230" y="512" width="160" height="16" fill="#FFC907"/>
  <text x="745" y="524" fill="#333333" font-size="16">32%</text>

  <!-- Photo controls below the canvas -->
  <rect y="540" width="960" height="92" fill="#FFFFFF"/>
  <text x="18" y="560" fill="#1B1B1B" font-size="14" font-weight="bold">Use</text>
  <g font-size="12" fill="#1B1B1B">
    <circle cx="26" cy="581" r="7" fill="#FFFFFF" stroke="#2E9DF7" stroke-width="2"/>
    <circle cx="26" cy="581" r="3" fill="#2E9DF7"/>
    <text x="39" y="585">Whole face</text>
    <circle cx="125" cy="581" r="7" fill="#FFFFFF" stroke="#2E9DF7" stroke-width="2"/>
    <text x="138" y="585">Eyes</text>
    <circle cx="190" cy="581" r="7" fill="#FFFFFF" stroke="#2E9DF7" stroke-width="2"/>
    <text x="203" y="585">Mouth</text>
  </g>
  <rect x="18" y="596" width="142" height="28" rx="4" fill="#2E9DF7"/>
  <text x="89" y="615" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Take face photo</text>
  <text x="180" y="603" fill="#1B1B1B" font-size="13" font-weight="bold">Shooter photo</text>
  <text x="180" y="620" fill="#333333" font-size="11">Choose a crop, then capture with your camera.</text>
  <rect x="812" y="553" width="112" height="68" rx="4" fill="#222222"/>
  <circle cx="868" cy="582" r="19" fill="#F4B183"/>
  <circle cx="861" cy="579" r="2" fill="#1B1B1B"/>
  <circle cx="875" cy="579" r="2" fill="#1B1B1B"/>
  <path d="M862 590 Q868 596 874 590" fill="none" stroke="#1B1B1B" stroke-width="2"/>
  <text x="868" y="614" text-anchor="middle" fill="#FFFFFF" font-size="9">photo preview</text>
  <text x="16" y="651" fill="#FFFFFF" font-size="12">Move: ← →     Fire both guns: hold Space</text>
</svg>
